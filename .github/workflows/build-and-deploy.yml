name: Build & Deploy WebGL

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: webgl-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  UNITY_VERSION: 6000.3.11f1
  BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  build-webgl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          swap-storage: false

      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo swapon --show
          free -h

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL
          buildName: WebGL

      - name: Fix paths for GitHub Pages
        run: |
          INDEX=$(find build -name 'index.html' -type f | head -1)
          if [ -z "$INDEX" ]; then
            echo "index.html not found under build/"
            find build -type f | head -20 || ls -laR build/ || true
            exit 1
          fi
          SOURCE_DIR=$(dirname "$INDEX")
          DEPLOY_DIR="$RUNNER_TEMP/webgl"
          mkdir -p "$DEPLOY_DIR"
          cp -a "$SOURCE_DIR/." "$DEPLOY_DIR/"
          echo "Using WebGL output at $SOURCE_DIR, deploying from $DEPLOY_DIR"
          sed -i "s|<head>|<head>\n    <base href=\"${{ env.BASE_PATH }}\">|" "$DEPLOY_DIR/index.html"
          # 캐시 무효화용 쿼리스트링(v=PRODUCT_VERSION)에 커밋 SHA를 덧붙인다 — 버전 번호를
          # 안 올려도 배포할 때마다 Build/*.wasm·.data·.framework.js URL이 달라져서, 브라우저가
          # 예전 배포의 캐시된 파일(특히 wasm)을 새 로더와 섞어 쓰는 "call_indirect to a
          # signature that does not match" 크래시를 막는다.
          sed -i "s|var cacheBust = \"v=\([^\"]*\)\";|var cacheBust = \"v=\1-${GITHUB_SHA::8}\";|" "$DEPLOY_DIR/index.html"
          echo "BUILD_DIR=$DEPLOY_DIR" >> "$GITHUB_ENV"

      - name: Upload WebGL artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebGL
          path: ${{ env.BUILD_DIR }}

  deploy-pages:
    needs: build-webgl
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download WebGL artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL
          path: webgl

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webgl

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 기획 시트 deploy_status 탭에 결과 기록 (시트 메뉴 「게임에 반영」으로 시작한 배포든 코드 푸시든)
  report-status:
    needs: [build-webgl, deploy-pages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: Tools

      - name: Report
        run: |
          SHA="${GITHUB_SHA::7}"
          MSG="$(git log -1 --format=%s | cut -c1-60)"
          if [ "${{ needs.deploy-pages.result }}" = "success" ]; then
            python3 Tools/report_deploy_status.py --result "배포 완료" \
              --detail "커밋 $SHA · $MSG — 게임을 새로고침해서 확인하세요" \
              --link "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          else
            python3 Tools/report_deploy_status.py --result "배포 실패" \
              --detail "커밋 $SHA · $MSG — 개발자에게 링크를 보내 주세요" \
              --link "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
